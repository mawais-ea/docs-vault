[project]
name = "docvault-backend"
version = "0.1.0"
description = "DocVault API: save PDFs and photos of documents; read, file and summarise them."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "anthropic>=1.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "pypdf>=5",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.routers", "app.services"]
